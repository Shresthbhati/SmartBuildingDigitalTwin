# Mosquitto configuration for Smart Building Digital Twin

# Listener for MQTT
listener 1883
protocol mqtt
allow_anonymous true

# Listener for WebSockets
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Security (for development only - disable for production)
allow_anonymous true

# Limits
max_connections 1000
max_inflight_messages 100
