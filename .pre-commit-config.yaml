repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig\.(app|node)\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint frontend/src --ext .ts,.tsx --fix
        language: system
        types: [file]
        files: ^frontend/src/.*\.(ts|tsx)$
        require_serial: true

      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types: [file]
        files: \.(ts|tsx|json|yaml|css|html)$
        require_serial: true
