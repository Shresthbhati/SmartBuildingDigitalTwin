[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20"
]
ignore = [
    "E501", "B008"
]
per-file-ignores = { "tests/*" = ["S101", "T201"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["STANDARD_LIBRARY", "THIRD_PARTY", "FIRST_PARTY", "LOCALFOLDER"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
